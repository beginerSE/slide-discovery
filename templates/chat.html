{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block content %}
<div class="chat-page">
  <div class="chat-intro">
    <div class="chat-intro-icon">{{ m.icon("message-circle", "icon-lg") }}</div>
    <h1 class="chat-title">対話検索</h1>
    <p class="chat-sub">
      過去の提案スライドに、話しかけるように質問できます。AIが該当資料を探し、
      ファイル名とページ番号を添えて回答します。
    </p>
    <div class="chat-examples">
      <span class="chat-example-label">質問の例:</span>
      <button type="button" class="chat-chip" data-chat-fill>クラスタリングの分析結果を報告した資料はある？</button>
      <button type="button" class="chat-chip" data-chat-fill>新規事業の提案で使えるロードマップのスライドを探して</button>
      <button type="button" class="chat-chip" data-chat-fill>金融業界向けのDX提案はどれ？</button>
    </div>
  </div>

  <div id="chat-thread" class="chat-thread"></div>

  <form class="chat-composer" hx-post="/ui/chat" hx-target="#chat-thread"
        hx-swap="beforeend" hx-disabled-elt="find button"
        hx-on::after-request="if(event.detail.successful){this.querySelector('[name=question]').value='';}">
    {% if series_options %}
    <label class="chat-series row gap-2 text-sm">
      <span class="text-muted">定例シリーズ</span>
      <select class="input" name="seriesId">
        <option value="">自動判定</option>
        {% for s in series_options %}
        <option value="{{ s.id }}">{{ s.name }}</option>
        {% endfor %}
      </select>
    </label>
    {% endif %}
    <input class="input chat-input" type="text" name="question" autocomplete="off"
      placeholder="質問を入力してEnter（例: 〇〇を報告した資料はある？）" required />
    <button type="submit" class="btn chat-send">
      <span class="chat-send-idle">{{ m.icon("send") }}送信</span>
      <span class="chat-send-busy">{{ m.icon("loader", "spin") }}検索中…</span>
    </button>
  </form>
</div>
{% endblock %}
