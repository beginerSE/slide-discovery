{% import "_macros.html" as m %}
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ログイン — 社内スライド検索</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}" />
</head>
<body>
  <div class="content">
    <div class="login-wrap space-y">
      <div style="text-align:center">
        <div class="login-logo">{{ m.icon("presentation", "icon-lg") }}</div>
        <h1 class="font-bold" style="font-size:1.35rem">社内スライド検索</h1>
        <p class="text-muted text-sm mt-1">AIが社内のスライド資料を横断・詳細に検索</p>
      </div>

      <div class="card card-body space-y">
        <div class="row gap-2" style="border-bottom:1px solid hsl(var(--border));margin:-1rem -1rem 0;">
          <button type="button" class="btn btn-ghost btn-block" id="tab-login" style="border-radius:0" onclick="showTab('login')">ログイン</button>
          <button type="button" class="btn btn-ghost btn-block" id="tab-register" style="border-radius:0" onclick="showTab('register')">新規登録</button>
        </div>

        {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

        <form method="post" action="/login" class="space-y-sm" id="form-login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="next" value="{{ next or '/' }}" />
          <div class="field">
            <label class="field-label" for="login-email">メールアドレス</label>
            <input class="input" id="login-email" type="email" name="email" required placeholder="you@example.com" value="{{ email or '' }}" />
          </div>
          <div class="field">
            <label class="field-label" for="login-password">パスワード</label>
            <input class="input" id="login-password" type="password" name="password" required placeholder="••••••••" />
          </div>
          <button class="btn btn-block btn-lg" type="submit">{{ m.icon("log-in") }}ログイン</button>
        </form>

        <form method="post" action="/register" class="space-y-sm" id="form-register" style="display:none">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
          <input type="hidden" name="next" value="{{ next or '/' }}" />
          <div class="field">
            <label class="field-label" for="reg-name">表示名（任意）</label>
            <input class="input" id="reg-name" type="text" name="displayName" placeholder="山田 太郎" />
          </div>
          <div class="field">
            <label class="field-label" for="reg-email">メールアドレス</label>
            <input class="input" id="reg-email" type="email" name="email" required placeholder="you@example.com" />
          </div>
          <div class="field">
            <label class="field-label" for="reg-password">パスワード（6文字以上）</label>
            <input class="input" id="reg-password" type="password" name="password" required minlength="6" placeholder="••••••••" />
          </div>
          <button class="btn btn-block btn-lg" type="submit">{{ m.icon("user") }}登録してはじめる</button>
        </form>
      </div>

      <p class="text-muted text-xs" style="text-align:center">
        テスト用: admin@example.com / adminpass123 ・ user@example.com / userpass123
      </p>
    </div>
  </div>

  <script>
    function showTab(which) {
      var login = which === "login";
      document.getElementById("form-login").style.display = login ? "" : "none";
      document.getElementById("form-register").style.display = login ? "none" : "";
      document.getElementById("tab-login").classList.toggle("active", login);
      document.getElementById("tab-register").classList.toggle("active", !login);
    }
    showTab("{{ 'register' if mode == 'register' else 'login' }}");
  </script>
</body>
</html>
