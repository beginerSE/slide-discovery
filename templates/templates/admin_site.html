{% extends "base.html" %}
{% import "_macros.html" as m %}
{% block title %}サイト管理 — 社内スライド検索{% endblock %}
{% block content %}
<div class="stack wrap-4xl" style="gap:1.5rem">
  <div>
    <h1 class="row gap-2" style="font-size:1.5rem;font-weight:700">{{ m.icon("settings", "icon-lg") }}サイト管理</h1>
    <p class="text-sm text-muted mt-1" style="max-width:46rem">外部サービスとの接続情報など、サイト全体の設定を管理します。</p>
  </div>

  <div id="admin-confluence-settings" hx-get="/ui/admin/confluence/settings" hx-trigger="load" hx-swap="innerHTML">
    <div class="card"><div class="card-body text-sm text-muted">Confluence 接続設定を読み込み中…</div></div>
  </div>
</div>
{% endblock %}
